url: "{{httpbin_url}}/delay/5"
method: GET
documentation: |-
  # 16 Expected timeout

  Settings intentionally sets timeoutMs to 1000. Network failures can also occur before the timeout.

  ## Expected result

  A client timeout is expected at approximately 1 second, before the requested 5-second delay.

  ## Notes

  Use Send once and inspect the response body, headers and timeline. Public demo services can be temporarily unavailable; a gateway error is not the expected application result. Do not use real credentials or personal data.
