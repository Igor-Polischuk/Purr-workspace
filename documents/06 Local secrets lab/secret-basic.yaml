purr: 2
settings:
  timeoutMs: 20000
  storeCookies: false
id: secret-basic
name: 02 Basic secret check
folderId: secrets
url: "{{httpbin_url}}/basic-auth/purr-demo/purr-demo-password"
method: GET
documentation: |-
  # 02 Basic secret check

  Set demo_password to purr-demo-password in the local secrets manager. Username is purr-demo. The password shown in the endpoint is deliberately public test data. Never substitute a real password.

  ## Expected result

  Before provisioning: missing demo_password. After setting the synthetic password: HTTP 200 and authenticated=true.

  ## Notes

  Use Send once and inspect the response body, headers and timeline. Public demo services can be temporarily unavailable; a gateway error is not the expected application result. Do not use real credentials or personal data.
auth:
  type: basic
  username: purr-demo
  password:
    kind: template
    value: "{{demo_password}}"
overrides:
  headers: false
  auth: false
  cookies: false
kind: http
