purr: 2
settings:
  timeoutMs: 20000
  storeCookies: false
id: poke-species
name: 03 Species and translations
folderId: pokemon
url: "{{pokeapi_url}}/pokemon-species/{{pokemon}}"
method: GET
documentation: |-
  # 03 Species and translations

  PokeAPI is read-only and requires no authentication. Inspect nested JSON using search and JSONPath. Change pokemon in Variables to bulbasaur or select the Alternate inputs environment.

  ## Expected result

  HTTP 200; localized names and flavor_text_entries arrays.

  ## Notes

  Use Send once and inspect the response body, headers and timeline. Public demo services can be temporarily unavailable; a gateway error is not the expected application result. Do not use real credentials or personal data.
auth:
  type: none
overrides:
  headers: false
  auth: false
  cookies: false
kind: http
