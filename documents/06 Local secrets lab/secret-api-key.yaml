purr: 2
settings:
  timeoutMs: 20000
  storeCookies: false
id: secret-api-key
name: 03 API key header echo
folderId: secrets
url: "{{echo_url}}/headers"
method: GET
documentation: |-
  # 03 API key header echo

  This is an encoding/secret-resolution exercise, not real API authorization. Export only these synthetic secrets when practicing transfer.

  ## Expected result

  HTTP 200; echoed headers include X-Purr-Demo-Key after demo_token has been provisioned.

  ## Notes

  Use Send once and inspect the response body, headers and timeline. Public demo services can be temporarily unavailable; a gateway error is not the expected application result. Do not use real credentials or personal data.
auth:
  type: api-key
  name: X-Purr-Demo-Key
  placement: header
  value:
    kind: template
    value: "{{demo_token}}"
overrides:
  headers: false
  auth: false
  cookies: false
kind: http
