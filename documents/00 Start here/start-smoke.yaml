documentation: |-
  # 01 First request

  Start without an environment: workspace defaults are sufficient. Open Docs, then Send. Explore response JSON, headers and timeline. Next visit folders 01 through 05. The secrets and Git labs are optional.

  ## Expected result

  HTTP 200; status is "ok" and method is "GET".

  ## Notes

  Use Send once and inspect the response body, headers and timeline. Public demo services can be temporarily unavailable; a gateway error is not the expected application result. Do not use real credentials or personal data.
