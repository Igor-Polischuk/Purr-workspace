purr: 2
settings:
  timeoutMs: 20000
  storeCookies: false
id: country-null
name: 05 Unknown country returns null
folderId: countries
url: "{{countries_url}}"
method: POST
documentation: |-
  # 05 Unknown country returns null

  A missing resource in GraphQL may return null instead of HTTP 404. Compare with the REST missing-product example.

  ## Expected result

  HTTP 200; data.country is null.

  ## Notes

  Use Send once and inspect the response body, headers and timeline. Public demo services can be temporarily unavailable; a gateway error is not the expected application result. Do not use real credentials or personal data.
auth:
  type: none
overrides:
  headers: false
  auth: false
  cookies: false
kind: graphql
graphql:
  query: |-
    query Missing {
      country(code: "ZZ") {
        code
        name
      }
    }
  variables: "{}"
  schemaId: schema-countries
