purr: 2
settings:
  timeoutMs: 20000
  storeCookies: false
id: secret-bearer
name: 01 Bearer secret echo
folderId: secrets
url: "{{httpbin_url}}/bearer"
method: GET
documentation: |-
  # 01 Bearer secret echo

  Set demo_token to purr-demo-token in the local secrets manager. Use only this synthetic value: this endpoint echoes the token. Clone/open the same workspace on a different profile to test missing secrets, then manually export/import an encrypted secrets package.

  ## Expected result

  Before provisioning: Purr reports a missing local secret. After provisioning: HTTP 200 and authenticated=true.

  ## Notes

  Use Send once and inspect the response body, headers and timeline. Public demo services can be temporarily unavailable; a gateway error is not the expected application result. Do not use real credentials or personal data.
auth:
  type: bearer
  token:
    kind: template
    value: "{{demo_token}}"
  prefix: Bearer
overrides:
  headers: false
  auth: false
  cookies: false
kind: http
