id: git-independent
name: 02 Independent change target
folderId: git
url: "{{echo_url}}/get"
method: GET
documentation: |-
  # 02 Independent change target

  Edit this request on one branch and Conflict practice target on another. These independent document edits should provide a clean-merge exercise.

  ## Expected result

  HTTP 200; args.lesson is independent-change.

  ## Notes

  Use Send once and inspect the response body, headers and timeline. Public demo services can be temporarily unavailable; a gateway error is not the expected application result. Do not use real credentials or personal data.
params:
  - name: lesson
    value: independent-change
auth:
  type: none
overrides:
  headers: false
  auth: false
  cookies: false
kind: http
