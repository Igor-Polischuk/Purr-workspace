documentation: |-
  # 18 Read demo cookie

  Without the setup request, an empty cookies object is valid. Cookies are local state and do not travel with a clone.

  ## Expected result

  HTTP 200; cookies includes purr_demo after Set demo cookie has succeeded.

  ## Notes

  Use Send once and inspect the response body, headers and timeline. Public demo services can be temporarily unavailable; a gateway error is not the expected application result. Do not use real credentials or personal data.
